<svg xmlns="http://www.w3.org/2000/svg" width="260" height="250" viewBox="0 0 260 250">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="55%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="fogGlow" cx="50%" cy="72%" r="65%">
      <stop offset="0%" stop-color="#1c2a22" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1c2a22" stop-opacity="0"/>
    </radialGradient>
    <symbol id="pine" viewBox="0 0 40 60">
      <rect x="17" y="50" width="6" height="10" fill="#120c07"/>
      <polygon points="20,0 34,26 6,26"/>
      <polygon points="20,14 36,38 4,38"/>
      <polygon points="20,26 38,52 2,52"/>
    </symbol>
  </defs>

  <rect width="260" height="250" fill="url(#skyGrad)"/>

  <circle cx="18" cy="20" r="1" fill="#5b7fff" opacity="0.55"/>
  <circle cx="70" cy="13" r="1.2" fill="#7c5cff" opacity="0.45"/>
  <circle cx="140" cy="24" r="1" fill="#5b7fff" opacity="0.4"/>
  <circle cx="200" cy="11" r="1.3" fill="#ffb84d" opacity="0.35"/>
  <circle cx="240" cy="30" r="1" fill="#5b7fff" opacity="0.45"/>
  <circle cx="105" cy="8" r="0.9" fill="#e8ecf7" opacity="0.3"/>

  <rect width="260" height="250" fill="url(#fogGlow)"/>

  <!-- far tree layer: small, hazy, distant -->
  <g fill="#182338" opacity="0.55">
    <use href="#pine" x="-4" y="92" width="32" height="48"/>
    <use href="#pine" x="52" y="98" width="26" height="40"/>
    <use href="#pine" x="118" y="90" width="34" height="50"/>
    <use href="#pine" x="178" y="99" width="28" height="42"/>
    <use href="#pine" x="228" y="93" width="32" height="48"/>
  </g>

  <!-- mid tree layer -->
  <g fill="#131c15" opacity="0.85">
    <use href="#pine" x="-14" y="130" width="46" height="70"/>
    <use href="#pine" x="42" y="140" width="40" height="60"/>
    <use href="#pine" x="98" y="128" width="50" height="76"/>
    <use href="#pine" x="163" y="138" width="42" height="64"/>
    <use href="#pine" x="220" y="130" width="46" height="70"/>
  </g>

  <!-- near tree layer: large, dark, grounded silhouettes -->
  <g fill="#080f09">
    <use href="#pine" x="-22" y="172" width="72" height="108"/>
    <use href="#pine" x="66" y="180" width="62" height="92"/>
    <use href="#pine" x="148" y="170" width="74" height="110"/>
    <use href="#pine" x="228" y="178" width="62" height="92"/>
  </g>

  <!-- ground scatter -->
  <ellipse cx="38" cy="242" rx="10" ry="4" fill="#0a0806" opacity="0.65"/>
  <ellipse cx="160" cy="246" rx="14" ry="5" fill="#0a0806" opacity="0.65"/>
  <ellipse cx="232" cy="244" rx="9" ry="4" fill="#0a0806" opacity="0.65"/>
</svg>
